[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyidfm"
version = "0.0.3"
description = "AI-ready Python API wrapper for Île de France mobilités open-data API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Robin David", email = "dev.robin.david@gmail.com"}
]
keywords = ["idfm", "api", "transport", "paris", "ile-de-france", "schedules", "traffic"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
]
dependencies = [
    "requests>=2.28.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
pyidfm = "pyidfm.__main__:main"

[project.optional-dependencies]
dev = [
    "sphinx>=7.2",
    "sphinx-book-theme>=1.1",
    "myst-parser>=2.0",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
]

[project.urls]
"Repository" = "https://github.com/RobinDavid/pyidfm"
"Bug Tracker" = "https://github.com/RobinDavid/pyidfm/issues"

[tool.setuptools]
packages = ["pyidfm"]

[tool.setuptools.package-dir]
"" = "."


